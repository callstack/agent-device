packages:
  - 'website'
  - 'packages/*'
# Keep non-interactive checks from downloading tooling or reinstalling dependencies implicitly.
pmOnFail: warn
verifyDepsBeforeRun: warn
allowBuilds:
  '@limrun/api@https://codeload.github.com/limrun-inc/typescript-sdk/tar.gz/83370dfd407d15c3a841338209d7ac1bf45c16a1': true
  fallow: true
minimumReleaseAgeExclude:
  - '@chenglou/freerange@0.0.4'
  - '@limrun/api@0.64.1'
overrides:
  brace-expansion@5: '^5.0.12'
  fast-uri: 3.1.7
  postcss: 8.5.23
  qs@6: ^6.16.0
  react-router: 7.18.2
  react-router-dom: 7.18.2
patchedDependencies:
  ast-v8-to-istanbul@1.0.7: patches/ast-v8-to-istanbul@1.0.7.patch
