packages:
  - 'website'
  - 'packages/*'
# Keep non-interactive checks from downloading tooling or reinstalling dependencies implicitly.
pmOnFail: warn
verifyDepsBeforeRun: warn
allowBuilds:
  fallow: true
minimumReleaseAgeExclude:
  - '@chenglou/freerange@0.0.4'
  - '@limrun/api@0.64.1 || 0.69.1'
overrides:
  brace-expansion@5: '^5.0.12'
  fast-uri: 3.1.9
  # ESLint tooling and @stryker-mutator/core declare minimatch ^10 or ~10. 10.2.6
  # is the last 10.x release, so the patched 11.0.1 for GHSA-g3hv-75wg-m249
  # crosses the major. Exact pin, and the @10 scope keeps other majors untouched.
  minimatch@10: 11.0.1
  postcss: 8.5.23
  qs@6: ^6.16.1
  react-router: 7.18.2
  react-router-dom: 7.18.2
  # @limrun/api hard-pins undici 7.29.1, even in its newest release. The exact
  # scoped override raises it to the patched 7.30.1 (GHSA-xjj6-f33q-929c).
  # Update the root, maestro, and provision-kit exact pins with this override.
  undici@7: 7.30.1
  zod@4: ^4.6.6
patchedDependencies:
  ast-v8-to-istanbul@1.0.7: patches/ast-v8-to-istanbul@1.0.7.patch
  mutation-testing-report-schema@3.8.4: patches/mutation-testing-report-schema@3.8.4.patch
