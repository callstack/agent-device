---
- scrollUntilVisible:
    element:
      id: home-open-form
- tapOn:
    id: home-open-form
- assertVisible: Checkout form
- tapOn:
    id: field-name
- inputText:
    text: ${CHECKOUT_NAME}
    label: Full name
- tapOn:
    id: field-email
- inputText: ${CHECKOUT_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: Checkout form
