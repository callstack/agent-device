# This file exists so examples/test-app is treated as its own pnpm workspace
# root. pnpm only honors `overrides` from a workspace root, and because this
# app is nested under the repo-root pnpm-workspace.yaml (without being a member)
# its overrides were silently ignored when declared in package.json, letting the
# lockfile drift back to vulnerable transitive versions (see PR #649). Keeping
# them here ensures they actually apply. These pin transitive deps to versions
# that clear Dependabot security alerts; ws/brace-expansion/js-yaml/@babel/core/
# compression/source-map-js/zod are scoped to the vulnerable major so unrelated
# majors elsewhere in the tree stay untouched. zod is scoped per major because
# @expo/cli hard-declares zod ^3.25.76 while expo-build-disk-cache uses zod ^4;
# both majors are below the patched floor 4.6.6, and @expo/cli's bundled usage
# (z.object/string/enum, safeParse, error.issues) is compatible with zod 4.
overrides:
  '@xmldom/xmldom': 0.8.15
  browserslist: ^4.28.7
  decode-uri-component: ^0.5.0
  postcss: 8.5.23
  uuid: 14.0.0
  ws@8: ^8.20.1
  ws@7: ^7.5.11
  brace-expansion@5: ^5.0.12
  shell-quote: ^1.11.0
  compression@1: ^1.8.2
  source-map-js@1: ^1.2.2
  js-yaml@4: ^4.3.1
  nanoid@3: ^3.3.18
  '@babel/core@7': ^7.29.6
  zod@3: ^4.6.6
  zod@4: ^4.6.6
patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
