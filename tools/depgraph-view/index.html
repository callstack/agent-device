<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/depgraph/" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-device · dependency graph</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #0a0a0a;
        --panel-2: #161616;
        --border: #ffffff29;
        --text: #eeeeee;
        --muted: #b4b4b4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 'Switzer',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        display: grid;
        grid-template-columns: 292px 1fr;
        grid-template-rows: 46px 1fr;
        grid-template-areas: 'side head' 'side canvas';
      }
      header {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .brand {
        background: var(--accent);
        color: #0a0a0a;
        padding: 2px 5px;
        font:
          500 15px/1.25 'Geist Mono',
          monospace;
        text-decoration: none;
        white-space: nowrap;
      }
      .brand:hover {
        background: var(--accent-hover);
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      header #stats {
        color: var(--muted);
        font:
          11px 'Geist Mono',
          monospace;
      }
      header .grow {
        flex: 1;
      }
      #search {
        width: 260px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 0;
        padding: 6px 10px;
        font: inherit;
      }
      #search:focus {
        border-color: var(--accent);
      }
      aside {
        grid-area: side;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      section.block {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      section.block h2 {
        margin: 0 0 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-family: 'Geist Mono', monospace;
        font-weight: 500;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      main {
        grid-area: canvas;
        position: relative;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      canvas.panning {
        cursor: grabbing;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 2.5px 0;
      }
      .row label {
        flex: 1;
        cursor: pointer;
        user-select: none;
      }
      #zones .row label {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .count {
        color: var(--muted);
        font-size: 11px;
      }
      .row.dim label,
      .row.dim .swatch {
        opacity: 0.35;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 0;
        flex: none;
      }
      input[type='checkbox'] {
        accent-color: var(--accent);
        margin: 0;
      }
      input[type='range'] {
        width: 120px;
        accent-color: var(--accent);
      }
      .slider-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
      }
      .slider-row span,
      .slider-row label {
        color: var(--muted);
        flex: 1;
      }
      button {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 0;
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }
      #details {
        white-space: normal;
      }
      #details .file {
        font-size: 12px;
        word-break: break-all;
        color: var(--accent);
      }
      #details .meta {
        color: var(--muted);
        font-size: 11px;
        margin: 4px 0 8px;
      }
      #details .dep {
        padding: 2px 4px;
        border-radius: 0;
        cursor: pointer;
        word-break: break-all;
      }
      #details .dep:hover {
        background: var(--panel-2);
      }
      #details .dep .kind {
        font-size: 10px;
        padding: 0 4px;
        border-radius: 0;
        margin-left: 5px;
      }
      #details h3 {
        margin: 10px 0 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      #tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(10, 10, 10, 0.96);
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 6px 9px;
        font-size: 11px;
        max-width: 420px;
        display: none;
        z-index: 5;
      }
      #tooltip .t-zone {
        color: var(--muted);
      }
      #status {
        position: absolute;
        left: 12px;
        bottom: 10px;
        color: var(--muted);
        font-size: 11px;
        pointer-events: none;
      }
      #help {
        position: absolute;
        right: 12px;
        bottom: 10px;
        color: var(--muted);
        font-size: 11px;
        pointer-events: none;
        text-align: right;
      }
      #help .mobile-help {
        display: none;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
      }
      select {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 0;
        padding: 3px 6px;
        font: inherit;
      }
      select:focus {
        border-color: var(--accent);
      }
      .bar-row {
        padding: 3px 0;
        cursor: pointer;
      }
      .bar-row .top {
        display: flex;
        gap: 7px;
        align-items: baseline;
      }
      .bar-row .top span:first-child {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar-row .count {
        color: var(--muted);
        font-size: 11px;
      }
      .bar {
        height: 3px;
        border-radius: 0;
        background: var(--panel-2);
        margin-top: 2px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 0;
      }
      @media (max-width: 700px) {
        body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 46px minmax(0, 1fr) minmax(160px, 35vh);
          grid-template-areas: 'head' 'canvas' 'side';
        }
        header #stats,
        #help .desktop-help {
          display: none;
        }
        header h1 {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }
        #help .mobile-help {
          display: inline;
        }
        #search {
          width: min(260px, 45vw);
        }
        aside {
          border-right: 0;
          border-top: 1px solid var(--border);
        }
        main {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <section class="block">
        <h2>Edge kinds</h2>
        <div id="kinds"></div>
      </section>
      <section class="block">
        <h2>Display</h2>
        <div class="slider-row">
          <label for="edgeAlpha">edge opacity</label
          ><input id="edgeAlpha" type="range" min="2" max="40" value="10" />
        </div>
        <div class="slider-row">
          <label for="labelMin">label fan-in ≥</label
          ><input id="labelMin" type="range" min="8" max="200" value="45" />
        </div>
        <div class="row">
          <input id="focus" type="checkbox" /><label for="focus"
            >focus mode (isolate selection)</label
          >
        </div>
        <div class="row">
          <input id="cycles" type="checkbox" /><label for="cycles">highlight cycles</label>
        </div>
        <div class="row">
          <input id="reachable" type="checkbox" /><label for="reachable"
            >hide value edges with another import path</label
          >
        </div>
        <div class="hint">Another path does not mean a direct import can be removed.</div>
      </section>
      <section class="block">
        <h2>Layout</h2>
        <div class="slider-row">
          <label for="spread">cluster spread</label
          ><input id="spread" type="range" min="6" max="26" value="14" />
        </div>
        <div class="btn-row">
          <button id="reheat">re-run layout</button>
          <button id="fit">fit (F)</button>
        </div>
      </section>
      <section class="block">
        <h2>Zones</h2>
        <div id="zones"></div>
      </section>
      <section class="block" id="analysis"></section>
      <section class="block" id="details">
        <h2>Selection</h2>
        <div class="hint">Click a node to inspect its dependencies.</div>
      </section>
    </aside>
    <header>
      <a class="brand" href="/docs/introduction">agent-device</a>
      <h1>Dependency graph</h1>
      <span id="stats"></span>
      <span class="grow"></span>
      <input
        id="search"
        aria-label="Search files"
        list="files"
        placeholder="Search files…"
        autocomplete="off"
      />
      <datalist id="files"></datalist>
    </header>
    <main>
      <canvas
        id="canvas"
        role="img"
        aria-label="Interactive dependency graph of repository files"
      ></canvas>
      <div id="tooltip"></div>
      <div id="status"></div>
      <div id="help">
        <span class="desktop-help"
          >drag = pan · scroll = zoom · drag node = pin · dbl-click = zoom to · Esc = clear</span
        >
        <span class="mobile-help">drag to pan</span>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
