name: 'Setup Fixture App'
description: 'Install a ready Release build of examples/test-app on the booted iOS simulator, from the shared build cache'

# Any job that needs a controlled app to drive can use this instead of an Apple
# system app. It fetches the Release binary that test-app-build-cache.yml
# published for the current Expo fingerprint, refreshes its JS, and installs it —
# turning a ~22 minute build into a download plus a seconds-long repack.
#
# Keyed on the Expo fingerprint, which hashes the native build and nothing else.
# A hit therefore guarantees only that the native side is current, so the JS the
# Release build embedded may be stale — @expo/repack-app swaps in a bundle built
# from the current source. If no artifact exists yet (the producer has not run
# for this fingerprint), it falls back to building inline, so a caller is never
# left without an app. Callers that run alongside the producer can opt into a
# bounded, producer-aware wait first, avoiding two simultaneous native builds
# on a cold key without idling after a failed or absent producer.
#
# The caller's job needs `permissions: actions: read` for the artifact lookup.
# Relevant to #320 (move replay coverage off system apps onto a stable fixture).

inputs:
  device-name:
    description: 'Simulator device name used for the inline-build fallback'
    required: false
    default: 'iPhone 17 Pro'
  install:
    description: 'Install the app onto the booted simulator'
    required: false
    default: 'true'
  wait-for-artifact-seconds:
    description: 'How long to poll for a concurrently produced artifact before building inline'
    required: false
    default: '0'
  producer-workflow:
    description: 'Workflow file expected to publish a cold artifact; enables liveness-aware waiting'
    required: false
    default: ''
  producer-head-sha:
    description: 'Commit expected on the producer workflow run'
    required: false
    default: ''

outputs:
  app-path:
    description: 'Path to the ready .app bundle'
    value: ${{ steps.locate.outputs.app-path }}
  app-id:
    description: "Bundle identifier read from the app's Info.plist"
    value: ${{ steps.locate.outputs.app-id }}
  source:
    description: "Where the binary came from: 'artifact' or 'build'"
    value: ${{ steps.fetch.outputs.source }}

runs:
  using: 'composite'
  steps:
    # The fingerprint/repack commands need the dependency graph. This shared
    # action avoids recreating it on every warm native-artifact consumer.
    - name: Setup test app dependencies
      uses: ./.github/actions/setup-test-app-dependencies

    - name: Fetch the cached Release binary
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        HASH="$(pnpm --dir examples/test-app exec fingerprint fingerprint:generate | jq -r .hash)"
        NAME="fingerprint.${HASH}.ios"
        DEST="${{ github.workspace }}/.tmp/fixture-app"
        rm -rf "$DEST"; mkdir -p "$DEST"
        WAIT_SECONDS="${{ inputs.wait-for-artifact-seconds }}"
        PRODUCER_WORKFLOW="${{ inputs.producer-workflow }}"
        PRODUCER_HEAD_SHA="${{ inputs.producer-head-sha }}"
        case "$WAIT_SECONDS" in
          ''|*[!0-9]*)
            echo "::error::wait-for-artifact-seconds must be a non-negative integer."
            exit 1
            ;;
        esac

        # A lookup failure (API outage, auth, transient 5xx) must not fail the
        # caller or trigger a pointless wait: it takes the inline-build path.
        query_artifact() {
          gh api "repos/${{ github.repository }}/actions/artifacts?name=${NAME}&per_page=1" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty' 2>/dev/null
        }
        if ! ART_ID="$(query_artifact)"; then
          echo "::warning::Could not query the build cache for $NAME; building inline."
          ART_ID=""
          WAIT_SECONDS=0
        fi
        if [ -z "$ART_ID" ] && [ "$WAIT_SECONDS" -gt 0 ]; then
          DEADLINE=$((SECONDS + WAIT_SECONDS))
          MISSING_PRODUCER_POLLS=0
          echo "$NAME is not available; waiting up to ${WAIT_SECONDS}s for its producer."
          while [ -z "$ART_ID" ] && [ "$SECONDS" -lt "$DEADLINE" ]; do
            sleep 30
            if ! ART_ID="$(query_artifact)"; then
              echo "::warning::Build cache polling failed for $NAME; building inline."
              ART_ID=""
              break
            fi
            if [ -n "$ART_ID" ]; then
              break
            fi

            # Do not burn the full wait after a producer failure, nor when the
            # workflow did not trigger for this commit. A short grace period
            # covers the normal Actions scheduling race.
            if [ -n "$PRODUCER_WORKFLOW" ] && [ -n "$PRODUCER_HEAD_SHA" ]; then
              if ! RUN_STATE="$(gh api \
                "repos/${{ github.repository }}/actions/workflows/${PRODUCER_WORKFLOW}/runs?head_sha=${PRODUCER_HEAD_SHA}&per_page=1" \
                --jq '(.workflow_runs[0] // empty) | [.id, .status, (.conclusion // "")] | @tsv' \
                2>/dev/null)"; then
                echo "::warning::Could not inspect the fixture producer; building inline."
                break
              fi
              if [ -z "$RUN_STATE" ]; then
                MISSING_PRODUCER_POLLS=$((MISSING_PRODUCER_POLLS + 1))
                if [ "$MISSING_PRODUCER_POLLS" -ge 3 ]; then
                  echo "No fixture producer appeared for $PRODUCER_HEAD_SHA; building inline."
                  break
                fi
                continue
              fi
              MISSING_PRODUCER_POLLS=0
              IFS="$(printf '\t')" read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<< "$RUN_STATE"
              if [ "$RUN_STATUS" = "completed" ]; then
                echo "Fixture producer run $RUN_ID completed with ${RUN_CONCLUSION:-unknown} but published no $NAME; building inline."
                break
              fi
              if ! IOS_JOB_STATE="$(gh api \
                "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "iOS Release")][0] | [.status, (.conclusion // "")] | @tsv' \
                2>/dev/null)"; then
                echo "::warning::Could not inspect the iOS fixture producer job; building inline."
                break
              fi
              if [ -n "$IOS_JOB_STATE" ]; then
                IFS="$(printf '\t')" read -r IOS_JOB_STATUS IOS_JOB_CONCLUSION <<< "$IOS_JOB_STATE"
                if [ "$IOS_JOB_STATUS" = "completed" ] && [ "$IOS_JOB_CONCLUSION" != "success" ]; then
                  echo "iOS fixture producer job in run $RUN_ID completed with ${IOS_JOB_CONCLUSION:-unknown}; building inline."
                  break
                fi
              fi
            fi
          done
        fi

        SOURCE=build
        if [ -n "$ART_ID" ]; then
          STAGE="$(mktemp -d)"
          # Any failure along the download path falls through to an inline build
          # rather than failing the caller.
          if gh api "repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip" > "$STAGE/a.zip" \
             && unzip -q "$STAGE/a.zip" -d "$STAGE" \
             && tar -xzf "$STAGE/binary.tar.gz" -C "$DEST"; then
            SOURCE=artifact
            echo "restored $NAME from the build cache"
          else
            echo "::warning::Could not restore $NAME; building inline."
            rm -rf "$DEST"/*.app
          fi
          rm -rf "$STAGE"
        else
          echo "$NAME not in the cache after the configured wait; building inline."
        fi
        echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

    # Fallback only: the producer builds the same way. `--device generic` avoids
    # needing a booted simulator; Release embeds the bundle so no Metro is needed.
    - name: Build the Release app (fallback)
      if: steps.fetch.outputs.source == 'build'
      shell: bash
      run: |
        set -euo pipefail
        pnpm --dir examples/test-app exec expo run:ios \
          --configuration Release \
          --device generic \
          --no-bundler \
          --output "${{ github.workspace }}/.tmp/fixture-app"

    - name: Locate fixture app
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        APP="$(find "${{ github.workspace }}/.tmp/fixture-app" -maxdepth 1 -type d -name '*.app' | head -1)"
        if [ -z "$APP" ]; then
          echo "::error::No fixture app bundle at .tmp/fixture-app."
          exit 1
        fi
        # Read the id from the bundle itself rather than duplicating it here, so
        # this cannot drift from what was actually built.
        APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
        echo "app-path=$APP" >> "$GITHUB_OUTPUT"
        echo "app-id=$APP_ID" >> "$GITHUB_OUTPUT"
        echo "fixture app: $(basename "$APP") ($APP_ID, source=${{ steps.fetch.outputs.source }})"

    # A cached artifact embeds the JS from whenever the producer built it.
    # --js-bundle-only refreshes exactly the gap the native fingerprint leaves;
    # an inline build already has current JS, so it is skipped there.
    - name: Repack the cached app with the current JS
      if: steps.fetch.outputs.source == 'artifact'
      shell: bash
      run: |
        set -euo pipefail
        APP="${{ steps.locate.outputs.app-path }}"
        OUT="${{ github.workspace }}/.tmp/fixture-app-repacked/$(basename "$APP")"
        rm -rf "$(dirname "$OUT")"; mkdir -p "$(dirname "$OUT")"
        pnpm --dir examples/test-app exec repack-app \
          --platform ios \
          --source-app "$APP" \
          --output "$OUT" \
          --js-bundle-only
        rm -rf "$APP"
        mv "$OUT" "$APP"

    - name: Install fixture app
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        xcrun simctl install booted "${{ steps.locate.outputs.app-path }}"
        # Fail loudly rather than let a caller drive a device with no app: a
        # missing app produces scenarios that fail for the wrong reason, or pass
        # while proving nothing.
        if ! xcrun simctl get_app_container booted "${{ steps.locate.outputs.app-id }}" >/dev/null 2>&1; then
          echo "::error::Fixture app ${{ steps.locate.outputs.app-id }} is not installed on the booted simulator."
          exit 1
        fi
        echo "installed ${{ steps.locate.outputs.app-id }}"
