name: Run iOS smoke tests
description: Run iOS smoke tests

# The caller boots the simulator, builds the runner, and restores the fixture app as one parallel
# group before it calls this action, because none of those three needs a booted simulator. Their
# outputs arrive as inputs: a composite cannot read the caller's step context.
inputs:
  simulator-udid:
    description: 'UDID of the iOS simulator the caller booted'
    required: true
  boot-timeout-seconds:
    description: 'Boot wait budget the caller-owned readiness check must honor'
    required: true
  fixture-app-path:
    description: 'Path to the restored fixture app bundle'
    required: true
  fixture-app-id:
    description: 'Bundle identifier of the restored fixture app'
    required: true
  fixture-source:
    description: 'Where the fixture binary came from: artifact or build'
    required: true

runs:
  using: composite
  steps:
    - name: Select iOS runner XCTests
      id: xctest-impact
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        node --experimental-strip-types scripts/apple-ci-impact.ts xctest
      shell: bash
    # The caller recorded the host focus canary before its boot started, so a simulator that takes
    # focus during boot is still measured against the pre-boot frontmost app.
    # The caller booted this simulator and built this runner alongside the fixture restore, so
    # both are already in flight when this action starts. Readiness stays mandatory here: no step
    # below may reach the device before it boots.
    - name: Wait for iOS test simulator
      run: |
        bash scripts/wait-for-ios-simulator.sh \
          "${{ inputs.simulator-udid }}" \
          "${{ inputs.boot-timeout-seconds }}"
      shell: bash
    - name: Run iOS runner platform checks
      id: ios-xctest
      if: steps.xctest-impact.outputs.run != 'false'
      run: |
        set -euo pipefail
        XCTESTRUN_PATH="$(find "$AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
        test -n "$XCTESTRUN_PATH"
        IOS_PR_TEST_ARGS=()
        IOS_PR_TEST_IDS="$(node --experimental-strip-types scripts/check-xctest-selection.ts --ios-pr-tests)"
        while IFS= read -r test_id; do
          IOS_PR_TEST_ARGS+=("-only-testing:$test_id")
        done <<< "$IOS_PR_TEST_IDS"
        test "${#IOS_PR_TEST_ARGS[@]}" -gt 0
        mkdir -p "$GITHUB_WORKSPACE/test/artifacts"
        xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN_PATH" \
          -destination "platform=iOS Simulator,id=${{ inputs.simulator-udid }}" \
          -resultBundlePath "$GITHUB_WORKSPACE/test/artifacts/ios-runner-regressions.xcresult" \
          "${IOS_PR_TEST_ARGS[@]}" 2>&1 | tee /tmp/agent-device-runner-regressions.log
        xcrun xcresulttool get test-results summary \
          --path "$GITHUB_WORKSPACE/test/artifacts/ios-runner-regressions.xcresult" \
          --compact > "$GITHUB_WORKSPACE/test/artifacts/ios-runner-regressions-summary.json"
        RESULT_SUMMARY_PATH="$GITHUB_WORKSPACE/test/artifacts/ios-runner-regressions-summary.json" \
          XCTEST_LANE=pr node --experimental-strip-types scripts/xctest-run-summary.ts
      shell: bash
    - name: Preflight iOS runner through public CLI
      env:
        AGENT_DEVICE_EXEC_TRACE: '1'
      run: |
        pnpm clean:daemon
        # The public-SDK record is the cold-startup evidence; the CLI timer only wraps attach.
        node --input-type=module -e '
          const { performance } = await import("node:perf_hooks");
          const { ensureDaemon } = await import("./dist/src/index.js");
          const t0 = performance.now();
          const c = await ensureDaemon({ stateDir: process.env.AGENT_DEVICE_STATE_DIR });
          console.log(JSON.stringify({ phase: "daemon_cold_startup", started: c.started, pid: c.daemon.pid, durationMs: Math.round(performance.now() - t0) }));
        '
        node bin/agent-device.mjs prepare ios-runner --platform ios --udid "${{ inputs.simulator-udid }}" --timeout "$AGENT_DEVICE_IOS_PREPARE_TIMEOUT_MS" --json
      shell: bash
    - name: Run iOS Settings replay smoke test
      run: |
        node bin/agent-device.mjs test test/integration/replays/ios/simulator/01-settings.ad --udid "${{ inputs.simulator-udid }}" --retries 2 --debug --artifacts-dir test/artifacts/replays-ios-simulator-smoke --report-junit test/artifacts/replays-ios-simulator-smoke.junit.xml
      shell: bash
    - name: Report fixture cache source
      run: |
        echo "Fixture app source: ${{ inputs.fixture-source }}" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - name: Run gesture pan-duration smoke replay
      run: |
        xcrun simctl install "${{ inputs.simulator-udid }}" "${{ inputs.fixture-app-path }}"
        node bin/agent-device.mjs test examples/test-app/replays/gesture-pan-duration.ad --udid "${{ inputs.simulator-udid }}" --timeout 180000 --retries 2 --artifacts-dir test/artifacts/replays-ios-gesture-pan-duration --report-junit test/artifacts/replays-ios-gesture-pan-duration.junit.xml
      shell: bash
    - name: Run fixture-backed iOS simulator E2E smoke
      env:
        AGENT_DEVICE_FIXTURE_APP_ID: ${{ inputs.fixture-app-id }}
        AGENT_DEVICE_FIXTURE_APP_PATH: ${{ inputs.fixture-app-path }}
        AGENT_DEVICE_IOS_E2E: '1'
        AGENT_DEVICE_IOS_E2E_TIER: smoke
        AGENT_DEVICE_IOS_UDID: ${{ inputs.simulator-udid }}
      run: |
        xcrun simctl spawn "$AGENT_DEVICE_IOS_UDID" defaults write com.apple.keyboard.preferences AutomaticMinimizationEnabled -bool false
        node --experimental-strip-types scripts/node-test-tmpdir.ts --test test/integration/smoke-ios-simulator-coverage.test.ts test/integration/smoke-ios-simulator.test.ts
      shell: bash
    - name: Assert simulator automation preserved host focus
      if: ${{ always() }}
      run: |
        set -euo pipefail
        test "$(cat .tmp/ios-host-focus-before)" = "com.apple.finder"
        FRONTMOST="$(osascript -e 'tell application "System Events" to get bundle identifier of first application process whose frontmost is true')"
        test "$FRONTMOST" = "com.apple.finder"
      shell: bash
    - name: Run iOS physical device smoke replay
      if: env.IOS_UDID != ''
      run: |
        pnpm clean:daemon
        node bin/agent-device.mjs test test/integration/replays/ios/device/01-physical-lifecycle.ad --udid "$IOS_UDID" --retries 2 --artifacts-dir test/artifacts/replays-ios-device-smoke --report-junit test/artifacts/replays-ios-device-smoke.junit.xml
      shell: bash
    - name: Assert iOS XCTest selection was honored
      if: always()
      env:
        SELECTED: ${{ steps.xctest-impact.outputs.run }}
        OUTCOME: ${{ steps.ios-xctest.outcome }}
      run: |
        if [ "$SELECTED" = 'true' ] && [ "$OUTCOME" = 'skipped' ]; then
          echo '::error::iOS runner XCTest was selected but its step was skipped.'
          exit 1
        fi
      shell: bash
