name: 'Setup Android Replay Host'
description: 'Prepare the Android CI host for replay tests and expose the daemon state path'

inputs:
  package-helpers:
    description: 'Restore or package the npm-bundled Android snapshot and IME helpers'
    required: false
    default: 'false'

outputs:
  agent-state-dir:
    description: 'Resolved agent-device daemon state directory'
    value: ${{ steps.agent-state.outputs.dir }}
  helpers-cache-hit:
    description: 'Whether packaged Android helpers were restored from cache'
    value: ${{ steps.android-helpers-cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Resolve agent-device daemon state
      id: agent-state
      run: echo "dir=$(pnpm --silent daemon:state-dir)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
      shell: bash

    - name: Resolve Android helper source hash
      if: inputs.package-helpers == 'true'
      id: android-helper-source
      run: |
        VERSION="$(node -p 'require("./package.json").version')"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "value=${{ hashFiles('android/snapshot-helper/AndroidManifest.xml', 'android/snapshot-helper/debug.keystore', 'android/snapshot-helper/src/**', 'android/ime-helper/AndroidManifest.xml', 'android/ime-helper/res/**', 'android/ime-helper/src/**', 'scripts/build-android-helper.sh', 'scripts/package-android-helper.sh', '.github/actions/setup-android-replay-host/action.yml', '.github/actions/setup-android-sdk/action.yml') }}" >> "$GITHUB_OUTPUT"
      shell: bash

    # The helper build refuses to guess its build-tools version on CI, and that version decides
    # the APK bytes, so both cache keys name it as well. The install is skipped when the runner
    # already has the pinned packages; the fixture APK steps need them on a cache hit too.
    - name: Setup Android SDK
      if: inputs.package-helpers == 'true'
      uses: ./.github/actions/setup-android-sdk

    - name: Restore packaged Android helpers
      if: inputs.package-helpers == 'true'
      id: android-helpers-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
      with:
        path: |
          android/snapshot-helper/dist
          android/ime-helper/dist
        key: android-helpers-${{ runner.os }}-${{ runner.arch }}-api36-bt${{ env.AGENT_DEVICE_ANDROID_BUILD_TOOLS }}-v${{ steps.android-helper-source.outputs.version }}-${{ steps.android-helper-source.outputs.value }}

    - name: Package npm-bundled Android helpers
      if: inputs.package-helpers == 'true' && steps.android-helpers-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/run-gate
      with:
        gate: android-helpers

    - name: Verify packaged Android helpers
      if: inputs.package-helpers == 'true'
      run: |
        VERSION="$(node -p 'require("./package.json").version')"
        test -f "android/snapshot-helper/dist/agent-device-android-snapshot-helper-$VERSION.manifest.json"
        test -f "android/ime-helper/dist/agent-device-android-ime-helper-$VERSION.manifest.json"
      shell: bash

    - name: Save packaged Android helpers
      if: inputs.package-helpers == 'true' && steps.android-helpers-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
      with:
        path: |
          android/snapshot-helper/dist
          android/ime-helper/dist
        key: android-helpers-${{ runner.os }}-${{ runner.arch }}-api36-bt${{ env.AGENT_DEVICE_ANDROID_BUILD_TOOLS }}-v${{ steps.android-helper-source.outputs.version }}-${{ steps.android-helper-source.outputs.value }}
