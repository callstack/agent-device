name: 'Run gate'
description: 'Run one registered check by its CheckId, so the workflow names the gate structurally'

# The seam that makes gate ownership provable without reading shell.
#
# A lane says WHICH gate it runs in `with.gate` — a typed input the manifest reads straight
# out of the YAML and validates against CHECK_CATALOG. Nothing parses a `run:` body to work
# out what a lane executes, so dead text in one (a multiline string, an uncalled function,
# a heredoc, `echo "pnpm gate x"`) cannot credit anything: it is not where the answer lives.
#
# `args` deliberately cannot change which gate runs. It is appended after the id, so the
# worst a wrong value does is fail the gate it already named.

inputs:
  gate:
    description: 'The CheckId to run. Must name an entry in CHECK_CATALOG.'
    required: true
  args:
    description: 'Extra arguments for the gate. Never selects which gate runs.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The exit code is the step's exit code — no `|| true`, no capture, nothing that would
    # let a gate run without being able to fail the lane.
    - shell: bash
      env:
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_ARGS: ${{ inputs.args }}
      run: pnpm gate "$INPUT_GATE" $INPUT_ARGS
