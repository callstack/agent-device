name: Run registered gate
description: Run one CHECK_CATALOG entry named structurally by the workflow
inputs:
  gate:
    description: Registered CHECK_CATALOG id
    required: true
  args:
    description: Optional arguments, one per line
    required: false
    default: ''
outputs:
  result:
    description: Last stdout line, for gates that produce a matrix or scalar
    value: ${{ steps.run.outputs.result }}
runs:
  using: composite
  steps:
    - name: Install first-party replay plugins for execution gates
      if: contains(fromJSON('["unit", "unit-ci", "provider-integration", "integration-node", "macos-coverage", "web-smoke", "mutation", "fuzz-parsers", "maestro-differential", "replay-ios", "replay-ios-device", "replay-macos", "replay-linux", "replay-android", "linux-command-evidence", "concurrency-torture"]'), inputs.gate)
      shell: bash
      run: |
        set -euo pipefail
        pnpm --filter @agent-device/maestro --filter @agent-device/replay build
        export AGENT_DEVICE_HOME="${AGENT_DEVICE_HOME:-$RUNNER_TEMP/agent-device-replay-plugins}"
        node --experimental-strip-types scripts/install-workspace-replay-plugins.ts
        echo "AGENT_DEVICE_HOME=$AGENT_DEVICE_HOME" >> "$GITHUB_ENV"
    - id: run
      shell: bash
      env:
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        command=(pnpm gate "$INPUT_GATE")
        while IFS= read -r arg; do
          if [ -n "$arg" ]; then
            command+=("$arg")
          fi
        done <<< "$INPUT_ARGS"
        output_file="$(mktemp)"
        trap 'rm -f "$output_file"' EXIT
        "${command[@]}" | tee "$output_file"
        {
          echo 'result<<__GATE_OUTPUT__'
          tail -n 1 "$output_file"
          echo '__GATE_OUTPUT__'
        } >> "$GITHUB_OUTPUT"
