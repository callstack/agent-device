name: Agent Guidance

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CONTEXT.md'
      - 'docs/adr/FORMAT.md'
      - 'docs/agents/**'
      - 'scripts/__tests__/agent-guidance-contract.test.ts'
      - 'scripts/check-affected/**'
      - 'package.json'
      - '.github/actions/run-gate/action.yml'
      - '.github/actions/setup-node-pnpm/action.yml'
      - '.github/workflows/agent-guidance.yml'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'CONTEXT.md'
      - 'docs/adr/FORMAT.md'
      - 'docs/agents/**'
      - 'scripts/__tests__/agent-guidance-contract.test.ts'
      - 'scripts/check-affected/**'
      - 'package.json'
      - '.github/actions/run-gate/action.yml'
      - '.github/actions/setup-node-pnpm/action.yml'
      - '.github/workflows/agent-guidance.yml'

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Ownership and context budgets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1 # v6.0.2

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check agent guidance
        uses: ./.github/actions/run-gate
        with: { gate: agent-guidance }
