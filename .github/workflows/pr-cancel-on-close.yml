name: Cancel runs of closed PRs

# A merged or closed PR gates nothing, so its queued and running runs only hold runners.
# `pull_request_target` runs the base branch's workflow with a token that can cancel runs of
# fork PRs too; it never checks out the PR's code.
on:
  pull_request_target:
    types:
      - closed

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pr-preview-cleanup.yml runs on the same close event and must finish.
      - name: Cancel the PR's unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch="$HEAD_REF" -f event=pull_request -f per_page=100 \
            --jq ".workflow_runs[]
              | select(.status != \"completed\")
              | select(.head_repository.full_name == \"$HEAD_REPO\")
              | select(.path != \".github/workflows/pr-preview-cleanup.yml\")
              | .id" |
            while read -r id; do
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            done
