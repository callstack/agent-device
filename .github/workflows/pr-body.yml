name: Pull Request Body

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Grades the pull request title and body from the event payload against docs/agents/pull-requests.md.
  body:
    name: Body rules
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Check the pull request body
        uses: ./.github/actions/run-gate
        with: { gate: pr-body }
