name: Linux

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CONTEXT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/actions/build-docs/action.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pr-preview.yml'
      - '.github/workflows/pr-preview-cleanup.yml'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-linux:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Force X11 mode (Xvfb) — no Wayland on CI.
      XDG_SESSION_TYPE: x11
      DISPLAY: ':99'
      # Headless GTK: avoid dconf issues, enable accessibility bridge.
      GSETTINGS_BACKEND: memory
      NO_AT_BRIDGE: '0'
      GTK_A11Y: atspi
      GTK_MODULES: 'gail:atk-bridge'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Unbounded, this step could not fail — it could only stall. On 2026-08-19 a slow mirror
      # held apt past the job's 30-minute budget on four main-branch runs and several unrelated
      # PRs, which reported as a red check on branches that never ran a line of project code.
      # Two bounds fix that: apt retries and times out each mirror request itself (a blip
      # self-heals without a manual re-run), and `timeout-minutes` is the backstop for a mirror
      # that drips bytes slowly enough to defeat the socket timeout. A healthy install takes
      # about a minute, so six is generous.
      - name: Install Linux desktop dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          APT_OPTS=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            # The runner's own unattended-upgrades timer holds the dpkg lock; wait, don't hang.
            -o DPkg::Lock::Timeout=60
          )
          sudo apt-get update -qq "${APT_OPTS[@]}"
          sudo apt-get install -y -qq "${APT_OPTS[@]}" \
            xvfb \
            xdotool \
            scrot \
            at-spi2-core \
            python3-gi \
            gir1.2-atspi-2.0 \
            libatk-adaptor \
            dbus-x11 \
            gnome-calculator \
            wmctrl

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Start Xvfb and D-Bus
        run: |
          # Start virtual framebuffer (1280x1024, 24-bit color)
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

          # Start a D-Bus session and export its env vars for subsequent steps.
          # dbus-launch forks a persistent daemon, so it survives the step.
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"

      - name: Start AT-SPI2 registry
        run: |
          # The registry must start AFTER DBUS_SESSION_BUS_ADDRESS is available
          # (it was written to GITHUB_ENV in the previous step).
          ATSPI_REG=$(find /usr -name at-spi2-registryd -type f 2>/dev/null | head -1)
          if [ -z "$ATSPI_REG" ]; then
            echo "::error::at-spi2-registryd not found. Install at-spi2-core."
            exit 1
          fi
          "$ATSPI_REG" &
          sleep 2
          # Health probe: verify the registry is reachable on the a11y bus
          if python3 -c "import gi; gi.require_version('Atspi','2.0'); from gi.repository import Atspi; d=Atspi.get_desktop(0); assert d is not None, 'desktop is None'; print(f'AT-SPI2 OK — {d.get_child_count()} apps')"; then
            echo "AT-SPI2 registry healthy"
          else
            echo "::error::AT-SPI2 registry started but health probe failed"
            exit 1
          fi

      - name: Verify environment
        run: |
          echo "=== Display ==="
          xdotool getdisplaygeometry
          echo "=== D-Bus ==="
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          echo "=== AT-SPI2 Python bindings ==="
          python3 -c "import gi; gi.require_version('Atspi', '2.0'); from gi.repository import Atspi; print('OK')"
          echo "=== AT-SPI2 tree dump (quick test) ==="
          python3 linux/atspi-dump.py --surface desktop --max-nodes 5 | python3 -m json.tool | head -20 || echo "::warning::AT-SPI2 tree dump returned no nodes (expected before any app is launched)"
          echo "=== xdotool ==="
          xdotool version

      # TEMPORARY — diagnostic-only, removed before this branch's fix lands. Round 3: prior
      # evidence proved Component.get_extents(SCREEN) returns (0,0) for every non-toplevel
      # widget, and Text.get_text() throws (binding shadowing with the deprecated 1-arg
      # Accessible.get_text — see https://discourse.gnome.org/t/how-can-i-explicitly-call-atspi-text-get-text/36684).
      # This round tests the two candidate fixes directly: CoordType.WINDOW + frame-offset
      # for extents, and the unbound Atspi.Text.get_text(accessible, ...) static-call form.
      - name: DIAGNOSTIC linux input investigation
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/diag

          cat > /tmp/diag/inspect2.py <<'PYEOF'
          import sys, json, time
          import gi
          gi.require_version("Atspi", "2.0")
          from gi.repository import Atspi

          def describe(accessible, depth=0, out=None):
              if out is None:
                  out = []
              try:
                  role = accessible.get_role_name() or "unknown"
              except Exception:
                  role = "ERR"
              try:
                  name = accessible.get_name() or ""
              except Exception:
                  name = ""
              rect_screen = None
              rect_window = None
              try:
                  comp = accessible.get_component_iface()
                  if comp:
                      e = comp.get_extents(Atspi.CoordType.SCREEN)
                      if e:
                          rect_screen = {"x": e.x, "y": e.y, "width": e.width, "height": e.height}
                      ew = comp.get_extents(Atspi.CoordType.WINDOW)
                      if ew:
                          rect_window = {"x": ew.x, "y": ew.y, "width": ew.width, "height": ew.height}
              except Exception as ex:
                  rect_screen = {"error": str(ex)}
              text_bound = None
              text_static = None
              char_count = None
              try:
                  t = accessible.get_text_iface()
                  if t:
                      try:
                          char_count = Atspi.Text.get_character_count(accessible)
                      except Exception as ex:
                          char_count = "ERR:" + str(ex)
                      try:
                          c = t.get_character_count()
                          text_bound = t.get_text(0, c) if c > 0 else ("(empty count=%d)" % c)
                      except Exception as ex:
                          text_bound = "ERR:" + str(ex)
                      try:
                          cc = char_count if isinstance(char_count, int) else 0
                          text_static = Atspi.Text.get_text(accessible, 0, cc) if cc > 0 else ("(empty count=%r)" % char_count)
                      except Exception as ex:
                          text_static = "ERR:" + str(ex)
              except Exception as ex:
                  text_bound = "OUTER_ERR:" + str(ex)
              out.append({
                  "depth": depth, "role": role, "name": name,
                  "rect_screen": rect_screen, "rect_window": rect_window,
                  "char_count_static": char_count,
                  "text_get_text_BOUND": text_bound,
                  "text_get_text_STATIC": text_static,
              })
              try:
                  cc2 = accessible.get_child_count()
              except Exception:
                  cc2 = 0
              for i in range(cc2):
                  try:
                      child = accessible.get_child_at_index(i)
                      if child:
                          describe(child, depth + 1, out)
                  except Exception:
                      pass
              return out

          def find_app(timeout_s=20.0):
              deadline = time.time() + timeout_s
              while time.time() < deadline:
                  desktop = Atspi.get_desktop(0)
                  n = desktop.get_child_count() if desktop else 0
                  for i in range(n):
                      app = desktop.get_child_at_index(i)
                      nm = (app.get_name() or "") if app else ""
                      if "alculator" in nm:
                          return app
                  time.sleep(0.5)
              return None

          def main():
              app = find_app()
              if not app:
                  json.dump({"error": "calculator app not found after polling"}, sys.stdout)
                  return
              nodes = describe(app)
              json.dump(nodes, sys.stdout, indent=2)

          if __name__ == "__main__":
              main()
          PYEOF

          echo "############ fresh launch, typed 155, dump extents(SCREEN vs WINDOW) + text(bound vs static) ############"
          gnome-calculator &
          python3 /tmp/diag/inspect2.py > /dev/null 2>&1 || true
          xdotool type --clearmodifiers -- "155" || true
          sleep 0.5
          python3 /tmp/diag/inspect2.py > /tmp/diag/f-tree.json 2>/tmp/diag/f-tree.err || true
          scrot /tmp/diag/f-typed-155.png || true

          echo "############ summary: button '1', its label, the frame, and any text/entry nodes ############"
          (python3 -c "
          import json
          d = json.load(open('/tmp/diag/f-tree.json'))
          if isinstance(d, list):
              for n in d:
                  interesting = (
                      n.get('name') == '1'
                      or n.get('depth') == 1
                      or n.get('char_count_static') not in (None, 0)
                      or (isinstance(n.get('text_get_text_STATIC'), str) and 'empty' not in n.get('text_get_text_STATIC', ''))
                  )
                  if interesting:
                      print(json.dumps(n))
          else:
              print('NOT A LIST:', d)
          " || true) | tee /tmp/diag/f-summary.txt

          pkill -f gnome-calculator || true; sleep 1
          echo "DONE" > /tmp/diag/DONE.txt

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-diag
          if-no-files-found: warn
          path: /tmp/diag/**

      - name: Run Linux replay smoke test
        run: pnpm clean:daemon

      - name: Execute Linux replay smoke test
        uses: ./.github/actions/run-gate
        with:
          gate: replay-linux
          args: |
            --retries
            2
            --report-junit
            test/artifacts/replays-linux.junit.xml

      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          if-no-files-found: ignore
          path: |
            test/artifacts/**
            test/screenshots/**
