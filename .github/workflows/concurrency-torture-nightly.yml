name: Concurrency Torture Nightly

# Seeded concurrency torture lane for session/lease/lock invariants (#1416,
# umbrella #1412 Track A). N concurrent clients drive randomized-but-seeded
# interleavings of open/mutate/close/takeover/kill against the real SessionStore
# + LeaseRegistry, with all concurrency routed through a deterministic scheduler
# so a seed fully determines execution order. Deterministic and offline — no
# devices, simulators, or wall-clock stress (those are out of scope for #1416).
#
# Scheduled + manual only: the PR gate already runs a fast default sweep via the
# Node integration lane; this nightly sweeps a much larger seed range to keep
# mining for ordering bugs. A failure prints the seed and the exact
# `TORTURE_SEED=<n> pnpm gate concurrency-torture` replay command.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of seeded interleavings to sweep (at most 20000)'
        required: false
        default: '5000'
      seed-start:
        description: 'First seed in the sweep (default: run number x 20000, a fresh range each run)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torture:
    name: Session/lease/lock torture sweep
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      # Job-level env would override a value written to GITHUB_ENV, so the step below sets both values.
      RUNS_INPUT: ${{ github.event.inputs.runs || '5000' }}
      SEED_START_INPUT: ${{ github.event.inputs.seed-start }}
      # Each run owns the seed range [run_number * stride, run_number * stride + runs).
      SEED_STRIDE: '20000'
      # Standard scheduled-lane artifact envelope (#1430) built via the shared
      # scripts/lib/lane-envelope.ts (commit, tool/configHash, seed range, result);
      # the seed sweep rides in the typed data payload. Emitted by the test and
      # uploaded below so the freshness watcher can detect a lane going dark.
      TORTURE_ENVELOPE: ${{ github.workspace }}/torture-results/envelope.json
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      # A seed fully determines execution order, so a fixed range only re-proves old seeds.
      # Without an explicit start, each run sweeps its own disjoint range.
      - name: Choose the seed range
        run: |
          digits='^[0-9]+$'
          if [[ ! "$RUNS_INPUT" =~ $digits ]] || (( 10#$RUNS_INPUT < 1 || 10#$RUNS_INPUT > SEED_STRIDE )); then
            echo "::error::runs must be an integer from 1 to $SEED_STRIDE"
            exit 1
          fi
          if [[ -n "$SEED_START_INPUT" && ! "$SEED_START_INPUT" =~ $digits ]]; then
            echo "::error::seed-start must be a non-negative integer"
            exit 1
          fi
          seed_start="${SEED_START_INPUT:-$((GITHUB_RUN_NUMBER * SEED_STRIDE))}"
          echo "TORTURE_RUNS=$((10#$RUNS_INPUT))" >> "$GITHUB_ENV"
          echo "TORTURE_SEED_START=$((10#$seed_start))" >> "$GITHUB_ENV"

      - name: Run concurrency torture sweep
        uses: ./.github/actions/run-gate
        with: { gate: concurrency-torture }

      - name: Upload torture lane envelope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: concurrency-torture-envelope
          path: torture-results/
          if-no-files-found: warn
