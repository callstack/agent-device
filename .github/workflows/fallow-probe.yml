name: Fallow probe (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/fallow-probe.yml'

permissions:
  contents: read

jobs:
  warm-from-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build the cache at the base commit (what a main push would save)
        run: |
          git checkout -q "$BASE"
          time pnpm exec fallow dead-code --summary || true
          time pnpm check:production-exports || true
          du -sh .fallow
          git checkout -q "$GITHUB_SHA"
      - name: audit on head, cache from base
        run: time pnpm gate fallow --base "$BASE" || true
      - name: production-exports on head, cache from base
        run: time pnpm gate production-exports || true
      - name: health on head, cache from base
        run: time pnpm exec fallow health --summary --performance || true
      - name: audit again (fully warm)
        run: time pnpm gate fallow --base "$BASE" || true

  parallel-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: slow
        run: sleep 20; echo "out=slow" >> "$GITHUB_OUTPUT"
        background: true
      - parallel:
          - run: sleep 10; echo a
          - run: sleep 10; echo b
      - wait: slow
      - run: echo "slow said ${{ steps.slow.outputs.out }}"
