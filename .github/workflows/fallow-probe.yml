name: Fallow probe (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/fallow-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Host
        run: |
          nproc; free -g; df -h .; uname -a
          FALLOW_VERIFY_LOG=1 pnpm exec fallow --version
          ls node_modules/.pnpm | grep -i fallow
      - name: sample statx paths during resolve
        run: |
          sudo apt-get install -y strace >/dev/null 2>&1 || true
          rm -rf .fallow
          timeout 90 strace -f -e trace=statx,newfstatat,openat,readlink -o /tmp/s.txt pnpm exec fallow dead-code --summary >/dev/null 2>&1 || true
          wc -l /tmp/s.txt
          echo "== top 60 paths"
          grep -o '"[^"]*"' /tmp/s.txt | sort | uniq -c | sort -rn | head -60
          echo "== top 40 parent dirs"
          grep -o '"[^"]*"' /tmp/s.txt | tr -d '"' | awk '{sub(/\/[^\/]*$/, ""); print}' | sort | uniq -c | sort -rn | head -40
          echo "== top 40 basenames"
          grep -o '"[^"]*"' /tmp/s.txt | tr -d '"' | awk -F/ '{print $NF}' | sort | uniq -c | sort -rn | head -40
          echo "== ENOENT share"
          grep -c ENOENT /tmp/s.txt || true
