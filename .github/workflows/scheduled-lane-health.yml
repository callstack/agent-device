name: Scheduled Lane Health

# Watches the watchers (#1430). Every schedule-triggered workflow in .github/workflows/ is
# classified from its recorded scheduled runs — healthy, failing (two consecutive failures), or
# dark (no run within two cadences) — because a lane that silently stops running looks exactly like
# a lane that never fails. Freshness fields land in lane-health.json for the repo-health snapshot,
# and an unhealthy lane opens or pings a single tracking issue.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report only; do not open or ping the alert issue"
        required: false
        default: "false"

permissions:
  contents: read
  # Reading workflow run history is what this job is: an explicit map makes every omitted scope
  # `none`, so leaving `actions` out would 403 the collection step.
  actions: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane-health:
    name: Scheduled Lane Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: first-run grace is anchored to the commit that added a lane's `schedule:`
          # trigger, and a shallow clone cannot answer that (lanes then stay pending, never alert).
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Classify scheduled lanes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}
        run: pnpm lanes:health --artifact-dir .tmp/lane-health $DRY_RUN

      - name: Upload lane health snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/lane-health
          if-no-files-found: warn
