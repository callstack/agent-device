name: Package Smoke

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsdown.config.ts'
      - 'scripts/build-android-helper.sh'
      - 'scripts/build-xcuitest-apple.sh'
      - 'scripts/package-android-helper.sh'
      - 'scripts/package-apple-runner-source.mjs'
      - 'scripts/patch-xcuitest-runner-icon.ts'
      - 'scripts/sync-mcp-metadata.mjs'
      - 'scripts/write-xcuitest-cache-metadata.mjs'
      - 'apple/macos-helper/**'
      - 'apple/runner/**'
      - 'android/ime-helper/**'
      - 'android/snapshot-helper/**'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/workflows/package-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsdown.config.ts'
      - 'scripts/build-android-helper.sh'
      - 'scripts/build-xcuitest-apple.sh'
      - 'scripts/package-android-helper.sh'
      - 'scripts/package-apple-runner-source.mjs'
      - 'scripts/patch-xcuitest-runner-icon.ts'
      - 'scripts/sync-mcp-metadata.mjs'
      - 'scripts/write-xcuitest-cache-metadata.mjs'
      - 'apple/macos-helper/**'
      - 'apple/runner/**'
      - 'android/ime-helper/**'
      - 'android/snapshot-helper/**'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/workflows/package-smoke.yml'

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build npm package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Build complete npm package
        run: pnpm prepack
