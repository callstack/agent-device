name: Release iOS Runner

on:
  # release.yml calls this after publishing a stable release; dispatch reruns it for one tag.
  workflow_call:
    inputs:
      release_tag:
        description: GitHub Release tag to upload assets to, for example v0.12.6.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload assets to, for example v0.12.6.
        required: true
        type: string
      checkout_ref:
        description: Optional branch, tag, or commit SHA to build. Defaults to the selected workflow ref.
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-ios-simulator-runner:
    name: Publish iOS Simulator Runner
    # Xcode 27 is this image's default. Limrun hosts load XCTest from their own Xcode 27, and the
    # packaging step refuses a runner from an older Xcode, which would embed XCTest.
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 90
    env:
      AGENT_DEVICE_XCUITEST_PLATFORM: ios
      AGENT_DEVICE_XCUITEST_DESTINATION: generic/platform=iOS Simulator
      AGENT_DEVICE_IOS_CLEAN_DERIVED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24.13'

      - name: Resolve release metadata
        id: meta
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs asset-tag "$TAG_NAME"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build iOS simulator runner
        env:
          AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH: ${{ github.workspace }}/.tmp/ios-runner-derived
        run: sh ./scripts/build-xcuitest-apple.sh
        shell: bash

      - name: Package iOS simulator runner
        id: package
        env:
          AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH: ${{ github.workspace }}/.tmp/ios-runner-derived
          RELEASE_ASSET_DIR: ${{ github.workspace }}/.tmp/release-assets
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_ASSET_DIR}"
          sh ./scripts/package-ios-simulator-runner.sh \
            "$RELEASE_VERSION" \
            "$RELEASE_TAG" \
            "${RELEASE_ASSET_DIR}"
        shell: bash

      - name: Upload runner assets to GitHub Release
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE_PATH" \
            "$CHECKSUM_PATH" \
            "$MANIFEST_PATH" \
            --clobber
        shell: bash
