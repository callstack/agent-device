name: Publish workspace package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact public workspace package name, for example @agent-device/doublespeed
        required: true
        type: string
      version:
        description: Version already committed in the package manifest
        required: true
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options: [latest, next]
      dry_run:
        description: Prepare and validate without publishing to npm
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-workspace-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-deps: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare package
        id: package
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          PACKAGE_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.tag }}
        run: pnpm release:workspace "$PACKAGE_NAME" "$PACKAGE_VERSION" "$NPM_TAG"

      - name: Validate npm publication
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_TAG: ${{ inputs.tag }}
        run: npm publish "$TARBALL" --dry-run --ignore-scripts --access public --tag "$NPM_TAG" --registry https://registry.npmjs.org

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-package
          path: ${{ steps.package.outputs.tarball }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.13'
          package-manager-cache: false

      - name: Download validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-package
          path: release

      - name: Publish to npm
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: npm publish release/package.tgz --ignore-scripts --access public --tag "$NPM_TAG" --registry https://registry.npmjs.org
