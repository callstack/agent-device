name: Release Android Snapshot Helper

on:
  # release.yml calls this after publishing a stable release; dispatch reruns it for one tag.
  workflow_call:
    inputs:
      release_tag:
        description: GitHub Release tag to upload assets to, for example v0.13.3.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload assets to, for example v0.13.3.
        required: true
        type: string
      checkout_ref:
        description: Optional branch, tag, or commit SHA to build. Defaults to the selected workflow ref.
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-android-snapshot-helper:
    name: Publish Android Snapshot Helper
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Checkout release validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-validator
          sparse-checkout: scripts/release-version.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.13'

      - name: Resolve release metadata
        id: meta
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node .release-validator/scripts/release-version.mjs asset-tag "$TAG_NAME"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      # Exports AGENT_DEVICE_ANDROID_BUILD_TOOLS, which the helper build requires on CI.
      - name: Setup Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Check Java toolchain
        run: |
          javac --version
          java --version

      - name: Package Android snapshot helper
        id: package
        env:
          RELEASE_ASSET_DIR: ${{ github.workspace }}/.tmp/release-assets
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          AGENT_DEVICE_ANDROID_HELPER: snapshot
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_ASSET_DIR}"
          sh ./scripts/package-android-helper.sh \
            "$RELEASE_VERSION" \
            "$RELEASE_TAG" \
            "${RELEASE_ASSET_DIR}"
        shell: bash

      - name: Upload helper assets to GitHub Release
        env:
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            "$MANIFEST_PATH" \
            --clobber
        shell: bash
